name: Actualizar catálogo
on:
  push:
    paths:
      - 'series/**'
      - 'scripts/build_catalog.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Escanear series y capítulos
        run: python scripts/build_catalog.py
      - name: Guardar catálogo generado
        run: |
          if [[ -n "$(git status --porcelain data/catalog.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "Actualizar catálogo automáticamente"
            git push
          else
            echo "Sin cambios"
          fi
